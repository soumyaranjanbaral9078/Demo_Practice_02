<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f3f6fb">
  <title>Student Information Form</title>
  <style>
    :root {
      color-scheme: light;
      font-family: "Segoe UI", Arial, sans-serif;
      color: #172033;
      background: #f3f6fb;
      font-synthesis: none;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 40px 20px;
    }

    .page {
      width: min(100%, 920px);
      margin: 0 auto;
    }

    .intro {
      margin-bottom: 24px;
      text-align: center;
    }

    .intro h1 {
      margin: 0 0 8px;
      color: #173b70;
      font-size: clamp(1.8rem, 4vw, 2.5rem);
    }

    .intro p {
      margin: 0;
      color: #5c687a;
    }

    .card {
      margin-bottom: 24px;
      padding: clamp(20px, 4vw, 36px);
      border: 1px solid #e2e8f0;
      border-radius: 16px;
      background: #fff;
      box-shadow: 0 12px 35px rgb(26 48 80 / 8%);
    }

    fieldset {
      margin: 0 0 26px;
      padding: 0;
      border: 0;
    }

    legend {
      width: 100%;
      margin-bottom: 16px;
      padding-bottom: 9px;
      border-bottom: 1px solid #e8edf4;
      color: #214c83;
      font-size: 1.08rem;
      font-weight: 700;
    }

    .fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .field.full {
      grid-column: 1 / -1;
    }

    label {
      font-size: 0.92rem;
      font-weight: 600;
    }

    input,
    select,
    textarea {
      width: 100%;
      min-height: 44px;
      padding: 10px 12px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #fff;
      color: #172033;
      font: inherit;
    }

    textarea {
      min-height: 88px;
      resize: vertical;
    }

    input:focus,
    select:focus,
    textarea:focus {
      border-color: #3574c5;
      outline: 3px solid rgb(53 116 197 / 16%);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      min-height: 44px;
      padding: 10px 18px;
      border: 0;
      border-radius: 8px;
      background: #205da5;
      color: #fff;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }

    button:hover {
      background: #174980;
    }

    button.secondary {
      border: 1px solid #b9c6d6;
      background: #fff;
      color: #214c83;
    }

    button.secondary:hover {
      background: #f1f5f9;
    }

    #details[hidden] {
      display: none;
    }

    .details-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      margin-bottom: 20px;
    }

    .details-heading h2 {
      margin: 0;
      color: #173b70;
      font-size: 1.4rem;
    }

    .details-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 24px;
      margin: 0;
    }

    .detail {
      padding: 12px 0;
      border-bottom: 1px solid #e8edf4;
      overflow-wrap: anywhere;
    }

    .detail dt {
      margin-bottom: 4px;
      color: #657286;
      font-size: 0.82rem;
      font-weight: 600;
    }

    .detail dd {
      margin: 0;
      white-space: pre-wrap;
    }

    @media (max-width: 600px) {
      body {
        padding: 24px 14px;
      }

      .fields,
      .details-grid {
        grid-template-columns: 1fr;
      }

      .details-heading {
        align-items: flex-start;
        flex-direction: column;
      }
    }

    @media print {
      body {
        padding: 0;
        background: #fff;
      }

      .intro,
      #student-form,
      .details-heading button {
        display: none !important;
      }

      .page,
      .card {
        width: 100%;
        margin: 0;
        padding: 0;
        border: 0;
        box-shadow: none;
      }

      #details[hidden] {
        display: none !important;
      }

      .details-heading {
        margin-bottom: 12px;
      }

      .detail {
        break-inside: avoid;
      }
    }
  </style>
</head>
<body>
  <main class="page">
    <header class="intro">
      <h1>Student Information Form</h1>
      <p>Enter the student details below, then view or save a copy as PDF.</p>
    </header>

    <form class="card" id="student-form">
      <fieldset>
        <legend>Personal Information</legend>
        <div class="fields">
          <div class="field">
            <label for="student-name">Full name *</label>
            <input id="student-name" name="Full name" autocomplete="name" required>
          </div>
          <div class="field">
            <label for="student-id">Student ID / roll number *</label>
            <input id="student-id" name="Student ID / roll number" required>
          </div>
          <div class="field">
            <label for="date-of-birth">Date of birth *</label>
            <input id="date-of-birth" name="Date of birth" type="date" required>
          </div>
          <div class="field">
            <label for="gender">Gender *</label>
            <select id="gender" name="Gender" required>
              <option value="">Select gender</option>
              <option>Female</option>
              <option>Male</option>
              <option>Non-binary</option>
              <option>Prefer not to say</option>
              <option>Other</option>
            </select>
          </div>
          <div class="field">
            <label for="email">Email address *</label>
            <input id="email" name="Email address" type="email" autocomplete="email" required>
          </div>
          <div class="field">
            <label for="phone">Phone number *</label>
            <input id="phone" name="Phone number" type="tel" autocomplete="tel" required>
          </div>
          <div class="field full">
            <label for="address">Home address *</label>
            <textarea id="address" name="Home address" autocomplete="street-address" required></textarea>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Academic Information</legend>
        <div class="fields">
          <div class="field">
            <label for="course">Course / program *</label>
            <input id="course" name="Course / program" required>
          </div>
          <div class="field">
            <label for="department">Department *</label>
            <input id="department" name="Department" required>
          </div>
          <div class="field">
            <label for="academic-year">Academic year *</label>
            <input id="academic-year" name="Academic year" placeholder="e.g. 2026–2027" required>
          </div>
          <div class="field">
            <label for="semester">Year / semester *</label>
            <input id="semester" name="Year / semester" required>
          </div>
          <div class="field">
            <label for="admission-date">Admission date *</label>
            <input id="admission-date" name="Admission date" type="date" required>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Parent / Guardian Information</legend>
        <div class="fields">
          <div class="field">
            <label for="guardian-name">Parent / guardian name *</label>
            <input id="guardian-name" name="Parent / guardian name" autocomplete="off" required>
          </div>
          <div class="field">
            <label for="guardian-phone">Parent / guardian phone *</label>
            <input id="guardian-phone" name="Parent / guardian phone" type="tel" required>
          </div>
        </div>
      </fieldset>

      <div class="actions">
        <button type="submit">Display Student Details</button>
        <button class="secondary" type="reset">Clear Form</button>
      </div>
    </form>

    <section class="card" id="details" aria-labelledby="details-title" aria-live="polite" hidden>
      <div class="details-heading">
        <h2 id="details-title">Student Details</h2>
        <button type="button" id="download-pdf">Download / Print PDF</button>
      </div>
      <dl class="details-grid" id="details-list"></dl>
    </section>
  </main>

  <script>
    const form = document.querySelector("#student-form");
    const details = document.querySelector("#details");
    const detailsList = document.querySelector("#details-list");

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      if (!form.reportValidity()) {
        return;
      }

      detailsList.replaceChildren();
      for (const field of form.querySelectorAll("input, select, textarea")) {
        const term = document.createElement("dt");
        const description = document.createElement("dd");
        const item = document.createElement("div");
        const value = field.value.trim();

        term.textContent = field.name;
        description.textContent = value || "Not provided";
        item.className = "detail";
        item.append(term, description);
        detailsList.append(item);
      }

      details.hidden = false;
      details.scrollIntoView({ behavior: "smooth", block: "start" });
    });

    form.addEventListener("reset", () => {
      details.hidden = true;
      detailsList.replaceChildren();
    });

    document.querySelector("#download-pdf").addEventListener("click", () => {
      window.print();
    });
  </script>
</body>
</html>
